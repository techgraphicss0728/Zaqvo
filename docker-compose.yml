# Zaqvo — local/dev stack (horizontal scaling: increase replicas for API/workers)
version: '3.9'

services:
  api:
    build:
      context: .
      dockerfile: zaqvo-backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - zaqvo-backend/.env
    environment:
      - APP_ENV=development
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173,http://localhost:5174
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      replicas: 1  # Increase for horizontal scaling (e.g. 3)

  celery-worker:
    build:
      context: .
      dockerfile: zaqvo-backend/Dockerfile
    command: celery -A app.celery_app worker -l info
    env_file:
      - zaqvo-backend/.env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/1
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - api
      - redis

  celery-beat:
    build:
      context: .
      dockerfile: zaqvo-backend/Dockerfile
    command: celery -A app.celery_app beat -l info
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/1
    depends_on:
      - redis

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - zaqvo_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  dashboard:
    build:
      context: zaqvo-dashboard
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000/api/v1
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
    ports:
      - "5174:80"
    depends_on:
      - api

volumes:
  zaqvo_mongo_data:
