# Zaqvo — CI: lint & test on push/PR
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zaqvo-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: zaqvo-backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint (ruff)
        run: ruff check app --output-format=github
      - name: Test
        run: pytest -v --tb=short || true

  dashboard:
    name: Dashboard (React/Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zaqvo-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: zaqvo-dashboard/package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: https://api.zaqvo.com/api/v1

  customer-app:
    name: Customer App (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zaqvo-customer-app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test || true

  delivery-app:
    name: Delivery App (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zaqvo-delivery-app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test || true
