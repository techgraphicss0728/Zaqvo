name: zaqvo_customer_app
description: Zaqvo customer-facing mobile app (Android & iOS).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_dotenv: ^5.1.0
  dio: ^5.7.0
  go_router: ^14.6.2
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  equatable: ^2.0.5
  intl: ^0.19.0
  skeletonizer: ^1.4.3
  flutter_riverpod: ^2.6.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.4
  google_maps_flutter: ^2.14.0
  geolocator: ^14.0.2
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  fluttertoast: ^8.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - .env
    - lib/assets/LOGO_ZAQVO.png
    - lib/assets/FEVICON_ZAQVO.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "lib/assets/FEVICON_ZAQVO.png"
  remove_alpha_ios: true
