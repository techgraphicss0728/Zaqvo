# Build image on push to main; push to GHCR and optionally deploy over SSH.
# Configure repository secrets: GHCR deploy token or use GITHUB_TOKEN (packages write).

name: Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Image repository (lowercase for GHCR)
        run: echo "IMAGE_REPO_LC=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with Ruff
        run: pip install ruff && ruff check app tests

      - name: Run tests
        run: pip install pytest pytest-asyncio httpx && pytest tests -q

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_REPO_LC }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.worker
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_REPO_LC }}-worker:latest

      # Optional: add an SSH or cloud deploy step using repository secrets, for example:
      # DEPLOY_SSH_HOST, DEPLOY_SSH_USER, DEPLOY_SSH_KEY — see appleboy/ssh-action.
      - name: Deploy note
        run: |
          echo "Images pushed. Pull ${{ env.REGISTRY }}/${{ env.IMAGE_REPO_LC }} and ${{ env.REGISTRY }}/${{ env.IMAGE_REPO_LC }}-worker:latest then restart your stack."
